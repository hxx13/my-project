<h2>成员表格改动确认</h2>
<p class="subtitle">"人均日频次" → "人均周频次" + 个人等级</p>

<div class="section">
  <h3>改动 1: 频次统计周期</h3>
  <div class="mockup">
    <div class="mockup-body" style="padding:16px;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <tr style="background:#fef3c7;">
          <td style="padding:10px;width:50%;"><strong>当前</strong>: 日均频次<br><span style="color:#888;">= 总进出次数 ÷ 时间范围天数</span></td>
          <td style="padding:10px;width:50%;"><strong style="color:#059669;">改为</strong>: 人均周频次<br><span style="color:#059669;">= 总进出次数 ÷ 时间范围周数</span></td>
        </tr>
      </table>
    </div>
  </div>
</div>

<div class="section">
  <h3>改动 2: "个人等级" 列 — 需要你确认</h3>
  <div class="options">
    <div class="option" data-choice="compute-from-freq" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>按频次自动分级</h3>
        <p>根据人均频次分段：≥10次 = 高活跃，5-9次 = 中活跃，1-4次 = 低活跃，0次 = 不活跃</p>
      </div>
    </div>
    <div class="option" data-choice="from-personnel" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>引用人员资料库等级</h3>
        <p>从人员资料库读取已有的"等级"字段（如初级/中级/高级/负责人）</p>
      </div>
    </div>
    <div class="option" data-choice="percentile" onclick="toggleSelect(this)">
      <div class="letter">C</div>
      <div class="content">
        <h3>百分比排名</h3>
        <p>在课题组内部按周频次排序，显示 "前 20%"、"前 50%" 等相对排名</p>
      </div>
    </div>
  </div>
</div>
