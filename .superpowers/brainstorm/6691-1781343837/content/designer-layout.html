<h2>设计器页面布局 — 哪种更顺手？</h2>
<p class="subtitle">左侧：工具栏 + 网格编辑区 / 右侧：属性面板。本次主要对比面板位置和编辑区大小</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>左右分栏（推荐）</h3>
      <p>左侧 70%：工具栏 + 网格编辑区。右侧 30%：属性面板（格子类型/字段配置/样式）。<br/>好处：编辑区大，操作直观；属性面板常驻可见，点击格子即时显示属性。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>全屏编辑 + 右侧抽屉</h3>
      <p>编辑区占满窗口，点格子后右侧滑出抽屉面板。<br/>好处：编辑区最大。坏处：每次操作多一步（打开/关闭抽屉）。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>顶部工具栏 + 底部双栏</h3>
      <p>顶部横排工具栏（导入/保存/发布/预览），下半部分左网格 + 右面板。<br/>类似 VS Code 的布局。</p>
    </div>
  </div>
</div>
