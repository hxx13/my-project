# Twin System — ECS 纯 Nginx 前置（静态本地 + API 走 FRP 内网口）
#
# 架构：
#   公网 :80/:443 → Nginx（本文件）
#     ├── /assets/*、index.html、favicon → /var/www/twin/static（部署时 rsync，不走 FRP）
#     └── /api/*、/models/*（未命中本地时）→ 127.0.0.1:18080（frp 仅绑本机）
#
# 前置条件：
#   1. ECS frps：proxyBindAddr = "127.0.0.1"（见 frps-nginx-mode.toml.example）
#   2. Windows frpc：remotePort = 18080（见 frpc-nginx-mode.toml.example）
#   3. 安全组：公网放行 80（443 可选），关闭公网 8080
#   4. 静态目录：bash deploy/ecs/setup-nginx-ecs.sh && sync-static-to-ecs.ps1
#
# 安装：见 deploy/ecs/README-nginx-static.md

upstream twin_spring_frp {
    server 127.0.0.1:18080;
    keepalive 32;
}

# 可选：有域名与证书后取消注释，并改 server_name
# server {
#     listen 80;
#     server_name 47.101.61.184 your.domain.example;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;   # 有证书时启用
    server_name 47.101.61.184;

    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 35m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    root /var/www/twin/static;

    # ── 前端构建产物（hash 文件名，长期缓存）──
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 人脸模型（若已 rsync 到 ECS；否则 fall through 到 @spring）
    location /models/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @spring;
    }

    # ── 必须穿透内网 Spring 的路径 ──
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://twin_spring_frp;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # SPA：index.html 短缓存（每次发版会换引用 hash）
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @spring {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://twin_spring_frp;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
