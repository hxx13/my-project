# ============================================================
# Decap CMS 配置 — TwinSystem 文档站
# ============================================================

backend:
  name: github
  repo: hxx13/my-project
  branch: main
  client_id: Ov23lixYShnVvRr3flFR
  client_secret: 7e00f698bd7d95ac245211499cc7e21f9799f219

# 文档的 git 仓库路径
site_url: https://hxx13.github.io/my-project
display_url: https://hxx13.github.io/my-project

# 语言
locale: zh_Hans

# 媒体文件（截图、图片等）
media_folder: docs/public/images
public_folder: /public/images

# 编辑器设置
editor:
  preview: true

# ── 内容集合 ──
collections:

  # --- 首页 ---
  - name: home
    label: 首页
    files:
      - file: docs/index.md
        label: 首页内容
        name: index
        fields:
          - { label: 正文, name: body, widget: markdown }

  # --- 架构文档 ---
  - name: architecture
    label: 架构文档
    files:
      - file: docs/ARCHITECTURE_BACKEND.md
        label: 后端架构
        name: arch-backend
        fields:
          - { label: 正文, name: body, widget: markdown }
      - file: docs/ARCHITECTURE_FRONTEND_WEB.md
        label: 前端 Web 架构
        name: arch-frontend-web
        fields:
          - { label: 正文, name: body, widget: markdown }
      - file: docs/ARCHITECTURE_FRONTEND_MP.md
        label: 前端小程序架构
        name: arch-frontend-mp
        fields:
          - { label: 正文, name: body, widget: markdown }

  # --- 设计规范 ---
  - name: design
    label: 设计档案
    files:
      - file: docs/ARCHITECTURE_SPEC_DESIGN_GUIDE.md
        label: 架构规范与设计指南
        name: design-guide
        fields:
          - { label: 正文, name: body, widget: markdown }
      - file: docs/superpowers/specs/2026-06-09-mindmap-design-doc.md
        label: 思维导图工具设计
        name: mindmap-design
        fields:
          - { label: 正文, name: body, widget: markdown }

  # --- 开发指南 ---
  - name: guides
    label: 开发指南
    files:
      - file: docs/DEV_DEPLOY_GUIDE.md
        label: 部署指南
        name: deploy-guide
        fields:
          - { label: 正文, name: body, widget: markdown }
      - file: docs/EXTENDING_BIZ_WORKFLOW.md
        label: 业务扩展工作流
        name: biz-workflow
        fields:
          - { label: 正文, name: body, widget: markdown }

  # --- 参考资料 ---
  - name: reference
    label: 参考资料
    files:
      - file: docs/IMPROVEMENT_ROADMAP.md
        label: 改进路线图
        name: roadmap
        fields:
          - { label: 正文, name: body, widget: markdown }
      - file: docs/COMPETITIVE_PRODUCT_ANALYSIS.md
        label: 竞品分析
        name: competitive-analysis
        fields:
          - { label: 正文, name: body, widget: markdown }
      - file: docs/ROLE_CAPABILITY_MATRIX.md
        label: 角色能力矩阵
        name: role-matrix
        fields:
          - { label: 正文, name: body, widget: markdown }

  # --- 思维导图（自由编辑） ---
  - name: mindmap
    label: 业务逻辑导图
    folder: docs/mindmap/mermaid
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string, required: false }
      - { label: 正文, name: body, widget: markdown }

  # --- 设计规范文件夹（自由新增） ---
  - name: specs
    label: 设计规范
    folder: docs/superpowers/specs
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string, required: false }
      - { label: 正文, name: body, widget: markdown }
