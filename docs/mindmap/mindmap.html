<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwinSystem 业务逻辑导图</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; height: 100vh; overflow: hidden; background: #f0f2f5;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 340px; min-width: 340px; background: #1a1a2e; color: #cdd6f4;
      display: flex; flex-direction: column; border-right: 1px solid #313244;
      z-index: 10;
    }
    #sidebar-header {
      padding: 20px 20px 12px; border-bottom: 1px solid #313244;
    }
    #sidebar-header h1 { font-size: 17px; color: #fff; font-weight: 700; margin-bottom: 2px; }
    #sidebar-header .timestamp { font-size: 11px; color: #6c7086; }

    #search-box {
      margin: 12px 16px; padding: 9px 14px; border-radius: 8px;
      border: 1px solid #45475a; background: #181825; color: #cdd6f4;
      font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    #search-box:focus { border-color: #89b4fa; }
    #search-box::placeholder { color: #585b70; }

    #domain-list { flex: 1; overflow-y: auto; padding: 6px 10px; }
    .domain-item {
      padding: 9px 14px; cursor: pointer; border-radius: 6px; font-size: 13px;
      transition: background 0.15s; margin-bottom: 2px; user-select: none;
    }
    .domain-item:hover { background: #2a2a4a; }
    .domain-item.active { background: #89b4fa; color: #1e1e2e; font-weight: 600; }

    #detail-panel {
      border-top: 1px solid #313244; padding: 16px; max-height: 320px;
      overflow-y: auto; font-size: 12px; line-height: 1.7;
    }
    #detail-panel h3 { color: #fff; margin-bottom: 8px; font-size: 14px; }
    #detail-panel .info-row { padding: 2px 0; display: flex; gap: 6px; }
    #detail-panel .info-label { color: #a6adc8; min-width: 60px; }
    #detail-panel .info-value { color: #cdd6f4; }

    /* ── Mindmap area ── */
    #mindmap { flex: 1; background: #f8f9fa; position: relative; }
    #mindmap svg { width: 100%; height: 100%; display: block; }

    /* ── Toolbar ── */
    #toolbar {
      position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 5;
    }
    #toolbar button {
      padding: 7px 15px; border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 12px; font-weight: 500;
      color: #374151; box-shadow: 0 1px 2px rgba(0,0,0,.05);
      transition: all 0.15s;
    }
    #toolbar button:hover { background: #f3f4f6; border-color: #9ca3af; }

    /* ── Empty / Loading ── */
    .placeholder {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #9ca3af; font-size: 15px;
    }

    /* ── Loading spinner ── */
    .spinner {
      width: 30px; height: 30px; border: 3px solid #e5e7eb;
      border-top-color: #89b4fa; border-radius: 50%; animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>

    var CROSS_CUTTING = [];

    // State
    var currentMm = null;
    var currentDomainIndex = 0;

    // ── Initialize ──
    async function init() {
      var win = window;
      var Transformer = win.markmap?.Transformer;
      var Markmap = win.markmap?.Markmap;

      if (!Transformer || !Markmap) {
        document.getElementById('mindmap').innerHTML =
          '<div class="placeholder">⚠ 无法加载 markmap 库，请检查网络连接以访问 CDN 资源</div>';
        return;
      }

      try {
        var transformer = new Transformer();
        var result = transformer.transform(MARKDOWN);
        var root = result.root;

        // Clear SVG before creating new instance
        var mindmapEl = document.getElementById('mindmap');
        mindmapEl.innerHTML = '';

        currentMm = Markmap.create('svg#mindmap-svg', {
          autoFit: true,
          duration: 500,
          maxWidth: 400,
          paddingX: 16,
        }, root);

        // Wrap the SVG
        var svg = mindmapEl.querySelector('svg');
        if (svg) svg.id = 'mindmap-svg';

        console.log('Markmap initialized with', countNodes(root), 'nodes');
      } catch (e) {
        console.error('Markmap init error:', e);
        document.getElementById('mindmap').innerHTML =
          '<div class="placeholder">⚠ 导图渲染失败: ' + e.message + '</div>';
      }

      // ── Domain list ──
      var listEl = document.getElementById('domain-list');
      DOMAINS.forEach(function(d, i) {
        var div = document.createElement('div');
        div.className = 'domain-item' + (i === 0 ? ' active' : '');
        div.textContent = d.name || d.id;
        div.title = 'ID: ' + d.id;
        div.onclick = function() {
          document.querySelectorAll('.domain-item').forEach(function(el) { el.classList.remove('active'); });
          div.classList.add('active');
          currentDomainIndex = i;
          showDomainDetail(d, i);
        };
        listEl.appendChild(div);
      });

      // Show first domain detail by default
      if (DOMAINS.length > 0) showDomainDetail(DOMAINS[0], 0);

      // ── Search ──
      document.getElementById('search-box').oninput = function(e) {
        var q = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.domain-item').forEach(function(el) {
          if (!q) { el.classList.remove('hidden'); return; }
          el.classList.toggle('hidden', !el.textContent.toLowerCase().includes(q));
        });
      };

      // ── Toolbar actions ──
      document.getElementById('btn-zoom-in').onclick = function() { if (currentMm) currentMm.rescale(1.3); };
      document.getElementById('btn-zoom-out').onclick = function() { if (currentMm) currentMm.rescale(0.77); };
      document.getElementById('btn-fit').onclick = function() { if (currentMm) currentMm.fit(); };
      document.getElementById('btn-reset').onclick = function() { if (currentMm) currentMm.fit(); };

      document.getElementById('btn-export').onclick = function() {
        var svg = document.querySelector('#mindmap svg');
        if (!svg) return alert('暂无导图可导出');
        try {
          var serializer = new XMLSerializer();
          var svgStr = serializer.serializeToString(svg);
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          var img = new Image();
          var blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          img.onload = function() {
            var scale = 2;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.scale(scale, scale);
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            var a = document.createElement('a');
            a.download = 'mindmap-' + new Date().toISOString().slice(0,10) + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
          };
          img.src = url;
        } catch (e) {
          alert('导出失败: ' + e.message);
        }
      };
    }

    // ── Domain detail panel ──
    function showDomainDetail(d, index) {
      var panel = document.getElementById('detail-panel');
      var name = d.name || d.id;
      var html = '<h3>' + escapeHtml(name) + '</h3>';
      html += '<div class="info-row"><span class="info-label">ID:</span><span class="info-value">' + escapeHtml(d.id) + '</span></div>';

      // Check cross-cutting for extra info
      var ccInfo = CROSS_CUTTING.find(function(cc) {
        return cc.involved_modules && cc.involved_modules.indexOf(d.id) >= 0;
      });
      if (ccInfo) {
        html += '<div style="margin-top:8px"><strong>横切关注点:</strong> ' + escapeHtml(ccInfo.name) + '</div>';
        if (ccInfo.description) html += '<div style="color:#a6adc8;font-size:11px">' + escapeHtml(ccInfo.description) + '</div>';
      }
      panel.innerHTML = html;
    }

    function countNodes(node) {
      var count = 1;
      if (node.children) {
        for (var i = 0; i < node.children.length; i++) {
          count += countNodes(node.children[i]);
        }
      }
      return count;
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Start
    init();
  </script>
