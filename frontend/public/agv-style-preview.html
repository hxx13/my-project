<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AGV 叉车顶视图 样式预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f1117;color:#e4e4e7;padding:20px}
h1{font-size:16px;margin-bottom:2px}
.sub{font-size:10px;color:#71717a;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#1a1b23;border:1px solid #2a2b33;border-radius:10px;padding:10px;cursor:pointer;transition:all .15s;text-align:center}
.card:hover{border-color:#52525b}
.card.selected{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b}
.card canvas{display:block;margin:0 auto}
.label{font-size:10px;font-weight:600;margin-top:4px}
.desc{font-size:8px;color:#71717a}
.preview-area{background:#0a0b10;border:1px solid #2a2b33;border-radius:12px;padding:16px;margin-top:16px}
.preview-area h2{font-size:13px;margin-bottom:8px}
.badge{font-size:8px;padding:2px 8px;border-radius:99px;background:#f59e0b20;color:#f59e0b}
</style>
</head>
<body>
<h1> AGV 叉车顶视图</h1>
<p class="sub">←前 行驶→ 尾叉 → <span id="selLabel">AGV激光叉车</span></p>
<div style="display:flex;gap:16px">
<div style="flex:1;overflow-y:auto;max-height:85vh">
<h2 style="font-size:12px;color:#a1a1aa;margin-bottom:8px"> 款式 <span class="badge">单选</span></h2>
<div class="grid" id="iconGrid"></div>
</div>
<div style="width:700px;flex-shrink:0">
<div class="preview-area" style="position:sticky;top:20px">
<h2> <span id="previewName" style="color:#f59e0b">AGV激光叉车</span></h2>
<canvas id="preview" width="680" height="260"></canvas>
</div>
</div>
</div>
<script>
// ═══ 绘制顺序: 激光塔底座 → 轮子 → 车身 → 叉臂 → 状态特效 ═══

// A 标准激光叉车
function dA(c,x,y,ang,clr,s){
  c.save();c.translate(x,y);c.rotate(-ang);
  // 激光塔底座(无绿环)
  c.fillStyle='#fff1';c.beginPath();c.arc(0,0,12,0,Math.PI*2);c.fill();
  c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.arc(0,0,5,0,Math.PI*2);c.fill();c.stroke();
  // 轮子
  c.fillStyle='#000';c.strokeStyle='#fff';c.lineWidth=.8;
  c.beginPath();c.roundRect(-8,-7.5,16,3,1);c.fill();c.stroke();
  c.beginPath();c.roundRect(-8,4.5,16,3,1);c.fill();c.stroke();
  // 车身
  c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1.2;
  c.beginPath();c.roundRect(-12,-6,24,12,4);c.fill();c.stroke();
  c.fillStyle=clr+'dd';c.beginPath();c.moveTo(10,-4);c.lineTo(10,4);c.lineTo(13,3);c.lineTo(13,-3);c.closePath();c.fill();c.strokeStyle='#fff';c.lineWidth=1;c.stroke();
  // 叉臂
  let b=11,l=16,g=5,f=s==='moving'?l:l*.7;
  c.strokeStyle='#d1d5db';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(b,-g);c.lineTo(b+f,-g);c.stroke();c.beginPath();c.moveTo(b,g);c.lineTo(b+f,g);c.stroke();
  // 货物
  if(s==='loaded'||s==='moving'){let bx=b+4,bw=16,bh=13;
    c.fillStyle='#d4a574';c.strokeStyle='#a0724a';c.lineWidth=1;c.beginPath();c.roundRect(bx,-bh/2,bw,bh,2);c.fill();c.stroke();
    c.fillStyle='#f59e0b';c.strokeStyle='#d97706';c.lineWidth=1;c.beginPath();c.roundRect(bx+2,-bh/2+2,bw-4,bh-4,2);c.fill();c.stroke();
    c.strokeStyle='#fff8';c.lineWidth=1.2;c.beginPath();c.moveTo(bx+3,-bh/2+3);c.lineTo(bx+bw-3,bh/2-3);c.stroke();c.beginPath();c.moveTo(bx+bw-3,-bh/2+3);c.lineTo(bx+3,bh/2-3);c.stroke();}
  // 状态
  if(s==='moving'){c.strokeStyle='#fff5';c.lineWidth=1.2;
    for(let i=0;i<3;i++){c.beginPath();c.moveTo(-20-i*10,-7+i*7);c.lineTo(-28-i*10,-7+i*7);c.stroke();}}
  if(s==='charging'){c.strokeStyle='#22c5ee40';c.lineWidth=3;c.beginPath();c.arc(0,0,24,0,Math.PI*2);c.stroke();
    c.fillStyle='#22c55e';c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.roundRect(-26,-7,8,14,3);c.fill();c.stroke();
    c.fillStyle='#166534';c.beginPath();c.roundRect(-24,-4,4,8,1);c.fill();
    c.strokeStyle='#22c55e';c.lineWidth=1.5;c.setLineDash([2,2]);c.beginPath();c.moveTo(-18,0);c.lineTo(-12,0);c.stroke();c.setLineDash([]);}
  if(s==='resting'){c.fillStyle='#00000040';c.beginPath();c.roundRect(-12,-6,24,12,4);c.fill();
    c.fillStyle='#fff6';c.font='10px system-ui';c.textAlign='center';c.fillText('Z',-18,-12);c.fillText('z',-22,-6);c.fillText('z',-24,2);}
  c.restore();}

// B 宽体叉车
function dB(c,x,y,ang,clr,s){
  c.save();c.translate(x,y);c.rotate(-ang);
  for(let[lx,ly]of[[-5,-2],[5,2]]){c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.arc(lx,ly,3.5,0,Math.PI*2);c.fill();c.stroke();}
  c.fillStyle='#000';c.strokeStyle='#fff';c.lineWidth=.8;
  c.beginPath();c.roundRect(-11,-8.5,22,3,1);c.fill();c.stroke();
  c.beginPath();c.roundRect(-11,5.5,22,3,1);c.fill();c.stroke();
  c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1.2;c.beginPath();c.roundRect(-14,-7,28,14,5);c.fill();c.stroke();
  c.fillStyle=clr+'dd';c.beginPath();c.moveTo(12,-4);c.lineTo(12,4);c.lineTo(15,3);c.lineTo(15,-3);c.closePath();c.fill();c.strokeStyle='#fff';c.lineWidth=1;c.stroke();
  let b=13,l=17,g=6,f=s==='moving'?l:l*.7;
  c.strokeStyle='#d1d5db';c.lineWidth=3.5;c.lineCap='round';c.beginPath();c.moveTo(b,-g);c.lineTo(b+f,-g);c.stroke();c.beginPath();c.moveTo(b,g);c.lineTo(b+f,g);c.stroke();
  if(s==='loaded'||s==='moving'){let bx=b+4,bw=16,bh=15;
    c.fillStyle='#d4a574';c.strokeStyle='#a0724a';c.lineWidth=1;c.beginPath();c.roundRect(bx,-bh/2,bw,bh,2);c.fill();c.stroke();
    c.fillStyle='#f59e0b';c.strokeStyle='#d97706';c.lineWidth=1;c.beginPath();c.roundRect(bx+2,-bh/2+2,bw-4,bh-4,2);c.fill();c.stroke();
    c.strokeStyle='#fff8';c.lineWidth=1.2;c.beginPath();c.moveTo(bx+4,-bh/2+4);c.lineTo(bx+bw-4,bh/2-4);c.stroke();c.beginPath();c.moveTo(bx+bw-4,-bh/2+4);c.lineTo(bx+4,bh/2-4);c.stroke();}
  if(s==='moving'){c.strokeStyle='#fff5';c.lineWidth=1.2;
    for(let i=0;i<3;i++){c.beginPath();c.moveTo(-24-i*10,-8+i*8);c.lineTo(-32-i*10,-8+i*8);c.stroke();}}
  if(s==='charging'){c.strokeStyle='#22c5ee40';c.lineWidth=3;c.beginPath();c.arc(0,0,26,0,Math.PI*2);c.stroke();
    c.fillStyle='#22c55e';c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.roundRect(-30,-8,8,16,3);c.fill();c.stroke();
    c.fillStyle='#166534';c.beginPath();c.roundRect(-28,-5,4,10,1);c.fill();
    c.strokeStyle='#22c55e';c.lineWidth=1.5;c.setLineDash([2,2]);c.beginPath();c.moveTo(-22,0);c.lineTo(-14,0);c.stroke();c.setLineDash([]);}
  if(s==='resting'){c.fillStyle='#00000040';c.beginPath();c.roundRect(-14,-7,28,14,5);c.fill();
    c.fillStyle='#fff6';c.font='11px system-ui';c.fillText('Z',-20,-14);c.fillText('z',-24,-8);c.fillText('z',-26,0);}
  c.restore();}

// C 重型叉车
function dC(c,x,y,ang,clr,s){
  c.save();c.translate(x,y);c.rotate(-ang);
  c.fillStyle='#fff2';c.beginPath();c.arc(0,0,14,0,Math.PI*2);c.fill();
  c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1.2;c.beginPath();c.arc(0,0,6,0,Math.PI*2);c.fill();c.stroke();
  c.fillStyle='#000';c.strokeStyle='#fff';c.lineWidth=.9;
  c.beginPath();c.roundRect(-9,-8.5,18,3,1);c.fill();c.stroke();
  c.beginPath();c.roundRect(-9,5.5,18,3,1);c.fill();c.stroke();
  c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1.3;c.beginPath();c.roundRect(-13,-7,26,14,6);c.fill();c.stroke();
  c.fillStyle=clr+'cc';c.beginPath();c.moveTo(11,-4);c.lineTo(11,4);c.lineTo(14,3);c.lineTo(14,-3);c.closePath();c.fill();c.strokeStyle='#fff';c.lineWidth=1;c.stroke();
  let b=12,l=18,g=6,f=s==='moving'?l:l*.7;
  c.strokeStyle='#d1d5db';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(b,-g);c.lineTo(b+f,-g);c.stroke();c.beginPath();c.moveTo(b,g);c.lineTo(b+f,g);c.stroke();
  if(s==='loaded'||s==='moving'){let bx=b+4,bw=16,bh=14;
    c.fillStyle='#d4a574';c.strokeStyle='#a0724a';c.lineWidth=1;c.beginPath();c.roundRect(bx,-bh/2,bw,bh,2);c.fill();c.stroke();
    c.fillStyle='#f59e0b';c.strokeStyle='#d97706';c.lineWidth=1;c.beginPath();c.roundRect(bx+3,-bh/2+3,bw-6,bh-6,2);c.fill();c.stroke();
    c.strokeStyle='#fff8';c.lineWidth=1.5;c.beginPath();c.moveTo(bx+5,-bh/2+4);c.lineTo(bx+bw-5,bh/2-4);c.stroke();c.beginPath();c.moveTo(bx+bw-5,-bh/2+4);c.lineTo(bx+5,bh/2-4);c.stroke();}
  if(s==='moving'){c.strokeStyle='#fff5';c.lineWidth=1.5;
    for(let i=0;i<3;i++){c.beginPath();c.moveTo(-22-i*10,-8+i*8);c.lineTo(-30-i*10,-8+i*8);c.stroke();}}
  if(s==='charging'){c.strokeStyle='#22c5ee40';c.lineWidth=4;c.beginPath();c.arc(0,0,28,0,Math.PI*2);c.stroke();
    c.fillStyle='#22c55e';c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.roundRect(-29,-8,8,16,3);c.fill();c.stroke();
    c.fillStyle='#166534';c.beginPath();c.roundRect(-27,-5,4,10,1);c.fill();
    c.strokeStyle='#22c55e';c.lineWidth=1.5;c.setLineDash([2,2]);c.beginPath();c.moveTo(-21,0);c.lineTo(-13,0);c.stroke();c.setLineDash([]);}
  if(s==='resting'){c.fillStyle='#00000045';c.beginPath();c.roundRect(-13,-7,26,14,6);c.fill();
    c.fillStyle='#fff7';c.font='12px system-ui';c.fillText('Z',-22,-14);c.fillText('z',-26,-6);c.fillText('z',-28,2);}
  c.restore();}

// D 紧凑叉车
function dD(c,x,y,ang,clr,s){
  c.save();c.translate(x,y);c.rotate(-ang);
  c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.arc(0,0,3.5,0,Math.PI*2);c.fill();c.stroke();
  c.fillStyle='#000';c.strokeStyle='#fff';c.lineWidth=.7;
  c.beginPath();c.roundRect(-7,-6,14,2.5,1);c.fill();c.stroke();
  c.beginPath();c.roundRect(-7,3.5,14,2.5,1);c.fill();c.stroke();
  c.fillStyle=clr;c.strokeStyle='#fff';c.lineWidth=1.1;c.beginPath();c.roundRect(-10,-5,20,10,3);c.fill();c.stroke();
  c.fillStyle=clr+'dd';c.beginPath();c.moveTo(8,-3);c.lineTo(8,3);c.lineTo(11,2);c.lineTo(11,-2);c.closePath();c.fill();c.strokeStyle='#fff';c.lineWidth=.8;c.stroke();
  let b=9,l=14,g=4,f=s==='moving'?l:l*.7;
  c.strokeStyle='#d1d5db';c.lineWidth=2.5;c.lineCap='round';c.beginPath();c.moveTo(b,-g);c.lineTo(b+f,-g);c.stroke();c.beginPath();c.moveTo(b,g);c.lineTo(b+f,g);c.stroke();
  if(s==='loaded'||s==='moving'){let bx=b+3,bw=13,bh=11;
    c.fillStyle='#d4a574';c.strokeStyle='#a0724a';c.lineWidth=.8;c.beginPath();c.roundRect(bx,-bh/2,bw,bh,2);c.fill();c.stroke();
    c.fillStyle='#f59e0b';c.strokeStyle='#d97706';c.lineWidth=.8;c.beginPath();c.roundRect(bx+2,-bh/2+2,bw-4,bh-4,2);c.fill();c.stroke();
    c.strokeStyle='#fff8';c.lineWidth=1;c.beginPath();c.moveTo(bx+2,-bh/2+3);c.lineTo(bx+bw-2,bh/2-3);c.stroke();c.beginPath();c.moveTo(bx+bw-2,-bh/2+3);c.lineTo(bx+2,bh/2-3);c.stroke();}
  if(s==='moving'){c.strokeStyle='#fff4';c.lineWidth=1;
    for(let i=0;i<3;i++){c.beginPath();c.moveTo(-16-i*8,-5+i*6);c.lineTo(-22-i*8,-5+i*6);c.stroke();}}
  if(s==='charging'){c.strokeStyle='#22c5ee40';c.lineWidth=2.5;c.beginPath();c.arc(0,0,20,0,Math.PI*2);c.stroke();
    c.fillStyle='#22c55e';c.strokeStyle='#fff';c.lineWidth=.7;c.beginPath();c.roundRect(-22,-6,6,12,2);c.fill();c.stroke();
    c.fillStyle='#166534';c.beginPath();c.roundRect(-20,-3,3,6,1);c.fill();
    c.strokeStyle='#22c55e';c.lineWidth=1;c.setLineDash([2,2]);c.beginPath();c.moveTo(-16,0);c.lineTo(-10,0);c.stroke();c.setLineDash([]);}
  if(s==='resting'){c.fillStyle='#00000040';c.beginPath();c.roundRect(-10,-5,20,10,3);c.fill();
    c.fillStyle='#fff5';c.font='9px system-ui';c.fillText('Z',-15,-10);c.fillText('z',-18,-5);}
  c.restore();}

const IC=[{id:'A',n:'AGV激光叉车',d:'标准款',f:dA},{id:'B',n:'宽体叉车',d:'双雷达',f:dB},{id:'C',n:'重型叉车',d:'大吨位',f:dC},{id:'D',n:'紧凑叉车',d:'小型灵活',f:dD}];
const SM=[{k:'default',l:'寻路中',cl:'#3b82f6'},{k:'loaded',l:'载货',cl:'#f97316'},{k:'moving',l:'运输中',cl:'#8b5cf6'},{k:'charging',l:'充电',cl:'#22c55e'},{k:'resting',l:'休息',cl:'#6b7280'}];
let sl=IC[0];
function rc(){
  document.getElementById('iconGrid').innerHTML=IC.map(i=>`<div class="card ${sl.id===i.id?'selected':''}" onclick="pk('${i.id}')"><canvas id="c_${i.id}" width="170" height="70"></canvas><div class="label">${i.n}</div><div class="desc">${i.d}</div></div>`).join('');
  IC.forEach(i=>{let c=document.getElementById('c_'+i.id)?.getContext('2d');if(c){i.f(c,50,35,0,'#3b82f6','default');i.f(c,128,35,0,'#f97316','loaded');}});
}
function pk(id){sl=IC.find(i=>i.id===id);document.getElementById('selLabel').textContent=sl.n;document.getElementById('previewName').textContent=sl.n;rc();rp();}
function rp(){
  let pv=document.getElementById('preview'),c=pv.getContext('2d');
  c.clearRect(0,0,pv.width,pv.height);c.fillStyle='#090a0f';c.fillRect(0,0,pv.width,pv.height);
  c.strokeStyle='#fff06';c.lineWidth=.4;
  for(let x=0;x<pv.width;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,pv.height);c.stroke();}
  for(let y=0;y<pv.height;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(pv.width,y);c.stroke();}
  // ref box
  c.fillStyle='rgba(0,0,0,0.7)';c.fillRect(500,195,150,52);
  c.fillStyle='#fff';c.font='bold 12px system-ui';c.textAlign='center';
  c.fillText('← 前',540,210);c.fillText('尾叉 →',600,210);
  c.fillText('行驶 ↑↓',570,230);
  c.strokeStyle='#fff8';c.lineWidth=1;c.beginPath();c.roundRect(525,200,50,20,3);c.stroke();
  c.fillStyle='#f59e0b';c.font='bold 10px system-ui';c.fillText('行驶 ∥ 轮',570,245);
  c.fillStyle='#fff5';c.font='10px system-ui';c.textAlign='left';c.fillText('轮=黑色■  激光塔=彩色圆    ',16,pv.height-8);
  SM.forEach((m,i)=>{let cx=80+i*135,cy=90;
    c.fillStyle='#a1a1aa';c.font='bold 11px system-ui';c.textAlign='center';c.fillText(m.l,cx,cy-52);
    sl.f(c,cx,cy,-Math.PI/10,m.cl,m.k);
    c.fillStyle=m.cl;c.beginPath();c.arc(cx,cy+48,4,0,Math.PI*2);c.fill();});
}
rc();rp();setInterval(()=>{if(document.querySelector('.card.selected'))rp();},400);
</script>
</body>
</html>
