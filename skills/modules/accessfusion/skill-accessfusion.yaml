skill:
  id: "skill-accessfusion"
  name: "门禁清洗与统计投喂"
  version: "1.0.0"
  module_path: "src/main/java/com/example/demo/modules/accessfusion"
  created_at: "2026-05-17"

philosophy:
  business_position: |
    以大华 ICC 摆闸为唯一事实源：归一写入 access_raw_event，按 access_door_rule 推断方向，
    落库 access_cleaned_event / access_visit_round，供隔离服使用统计与审计订阅（IsolationUsageReportService）。
    第一期不替换 twin 扫卡/在馆逻辑。

  design_principles:
    - "DDL：schema.sql + scripts/access_fusion.ddl.sql + AccessFusionSchemaMigrator"
    - "定时任务：ACCESS_CLEAN_PACKAGE_DAILY（每日到点增量入库）+ DAHUA_SWING_STATS_PULL_PREVIOUS_DAY/WEEK/SINCE_LAST（按 periodMode 独立到点，互不复盖；HISTORICAL_RANGE 仅手动）；实时 DahuaSwingPullTask 仍为窗口轮询"
    - "管理端入口：/admin/dahua-swing-tasks（Tab：实时拉取 | 审计拉取含回溯 | 门禁记录库）；/admin/access-fusion（概览/试算/总库/批次）；旧 daily/backfill/records/audit-source 路由 redirect"
    - "清洗总库：access_clean_package_item 按 channel 账本 upsert；每次合并写 access_swing_clean_run（配置快照含 statsTaskId/数据窗/实际查询窗、MANUAL/SCHEDULED/RERUN）；手动试算/入库默认 SELECTED_TASK + pull_task_type=STATS；增量模式为 max(数据窗开始,游标) 而非丢弃开始时间；进出筛选在 applyResolved 后内存过滤；auto_clean_package 控制定时自动入库（ALL_LINKED）；重跑删除 last_run_id 对应行后重写"
    - "统计开关：app.analytics.isolation.data-source=access_package（默认）|cleaned|aro；主口径=AccessCleanPackageAnalyticsService（通道+时间）；ARO 校区/楼层仅 auxiliaryFlow；套数=INCLUDED；轮次 swing_time 配对"
    - "保存后禁止整表刷新（前端统计页遵守 post-save-no-full-refresh.mdc）"

architecture:
  controllers:
    - "AccessFusionController /api/v1/access-fusion"
  services:
    - "AccessRawEventIngestService（DahuaSwingPullService 同步写入）"
    - "AccessDirectionInferenceEngine"
    - "AccessEventCleanService"
    - "AccessFusionReviewService（人工复核 + 可选 AI 建议）"
    - "AccessFusionCompareService（7 天 ARO 对照）"
  frontend:
    - "frontend/src/pages/AdminDahuaSwingTasksPage.tsx（三 Tab  hub）"
    - "frontend/src/pages/AdminAccessFusionPage.tsx + useAccessFusionWorkspace"
    - "frontend/src/api/domains/accessFusion.api.ts"
    - "frontend/src/api/domains/accessAudit.api.ts（previewSwing 含 tags/进出/受众；records/enrich；quality-summary）"

integration:
  dahua: "DahuaSwingPullService/DahuaSwingStatsPullService → pageData 解析部门落库 twin_dahua_swing_record → ingestFromSwing"
  analytics: "IsolationUsageReportService → AccessCleanPackageAnalyticsService + AroFlowAuxiliaryAnalyticsService"
  room_mapping: "AccessFusionRoomResolver ← room_mapping_channel + room_mapping_room"

cautions:
  - "无 twin_card_mapping 的刷卡不计入隔离服轮次"
  - "尾随 TAILGATE_SUSPECT 首期仅标记与人工复核，不自动拆账"
  - "改表须同步 DDL 脚本（db-schema-ddl-mandatory.mdc）"
