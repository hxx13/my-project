skill:
  id: "skill-notification"
  name: "Notification 通知"
  version: "1.0.0"
  module_path: "src/main/java/com/example/demo/modules/notification"
  status: "draft"
  created_at: "2026-05-17"

philosophy:
  business_position: |
    站内通知、外部通信配置、运行时配置、管理端设置种子（DashboardCodexConfigSeed 等）。

architecture:
  controllers:
    - "NotificationController"
    - "ExternalCommConfigController"
    - "RuntimeConfigController"
    - "AdminSettingsController"

read_state:
  storage: "sys_notification_recipient.is_read / read_time"
  apis:
    - "PATCH /api/notifications/{id}/read — 单条"
    - "PATCH /api/notifications/read-by-biz — 同一 bizType+bizId 全部事件已读（工单页与消息中心联动）"
    - "PATCH /api/notifications/read-all — 当前用户全部已读"
    - "POST /api/notifications/unread-biz-flags — 批量查询业务单未读"
  client_sync:
    web: "frontend/src/features/notification/notificationReadSync.ts"
    mini: "aroapp/miniprogram/utils/notificationReadSync.js"
  badges: "报修/采购/消息待处理角标改为未读通知数，已读后不再因工单未完结而持续提示"

note: "详细表结构与渠道策略待按需补充；扩展多渠道时参考 yudao 策略模式"
