spring.application.name=demo
# 应用版本号（启动横幅显示）
twin.app.version=2.0
# 日志文件根目录（prod profile 下生效；docker 忽略）
LOG_PATH=/var/log/twin
# 启动详细模式：true 恢复各阶段内部 details 输出（排查启动问题时开启）
twin.logging.startup.verbose=false
# 浏览器自动打开（local profile 下是否自动打开前端页面）
app.browser.auto-open=true
app.browser.url=http://localhost:5173
# 本地默认 8080；若与其它进程冲突可改端口，并同步 frpc.toml 的 localPort、frontend/vite 代理。
server.port=8080
# 穿透/公网：压缩 JSON/JS/CSS，显著降低 FRP 隧道传输量
server.compression.enabled=true
server.compression.mime-types=application/javascript,text/css,application/json,text/html,text/plain,application/xml,image/svg+xml
server.compression.min-response-size=1024
# 静态资源（/assets/*）浏览器缓存 — 重复访问不再穿透拉 6MB JS
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
# 额外 HTTPS（默认 18443）：已禁用，无需局域网摄像头安全上下文
app.server.https-extra.enabled=false
app.server.https-extra.port=18443
app.server.https-extra.key-store-password=twinlocal
# Socket.IO 实时推送端口（生产/对外穿透默认 9092；local profile 改为 9093）
app.socketio.port=9092
# JWT 签名密钥（Base64 编码，至少 256 bits）。持久化密钥确保 server 重启后旧 token 仍然有效，
# 配合 WebSocket 断线重连 + 强制同步刷新按钮即可恢复全部页面状态，无需重新登录。
# 生产环境请替换为独立随机密钥。
app.jwt.secret=kjDJOuVmTcsMkqSMs89tgCOfkSvgcKqRiPCsKmd56Zk=
# 头像代理 query 较长时放宽请求行
server.max-http-request-header-size=65536

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# SSE 长连接（GET /api/notifications/stream）：须与 NotificationPushService 中 SseEmitter 超时一致（当前 30min），
# 否则 Spring MVC 异步层会先超时并触发 AsyncRequestTimeoutException（响应已开始写入 event-stream 时出现 response committed）。
spring.mvc.async.request-timeout=30m

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
#logging.level.org.springframework.web.filter=DEBUG
logging.level.io.netty=ERROR
logging.level.com.corundumstudio.socketio=ERROR
logging.level.org.apache.coyote.http11.Http11Processor=ERROR

# 控制台仅正文：由 logback-spring.xml 强制 pattern=%msg%n（无前缀）。若删除 logback-spring.xml，可改用下面一行。
logging.pattern.console=%msg%n
#logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %36.36logger : %msg%n

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# characterEncoding 须为 Java 合法名 UTF-8；小写 utf-8 易被映射为 MySQL 三字节 utf8，导致中文乱码
spring.datasource.url=jdbc:mysql://localhost:3306/twin_system?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:SuperAdmin@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hikari connectionInitSql 仅支持单条；charset 见 URL；会话 time_zone 由 forceConnectionTimeZoneToSession 同步为 Asia/Shanghai
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# 默认调度池线程数（门禁/统一调度/大华等 @Scheduled）；与 WinCC 遥测独立池分离，避免大轮询挤占主业务
spring.task.scheduling.pool.size=12

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# 与 sys_user.role 存枚举名（如 SUPER_ADMIN）一致，避免默认按 ordinal 映射错误
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler

# 启动时在应用内执行 classpath:db/bootstrap-*.sql（含 login-branding-invite-chat、admin_file_template、twin_student_violation 等，与 scripts 下 DDL 同源），
# 无需在库外手工跑 SQL；生产若禁止应用账号 DDL 或已由 DBA 建表，可改为 false。
app.schema.auto-ensure-embedded-core-ddl=true

# MySQL/MariaDB 启动检测：若 sys_user 缺少 mini_preferences_json（小程序个人配置），自动 ALTER 一次。
# 若库账号无 DDL 权限或不由应用改表，改为 false 并由 DBA 执行 src/main/resources/sql/manual_migrate_sys_user_mysql.sql
app.schema.auto-ensure-sys-user-mini-preferences=true
# Windows 下若 JVM 默认非 UTF-8，显式保证 schema/data 脚本按 UTF-8 读入，避免初始化进库的中文已乱码
spring.sql.init.encoding=UTF-8

# 小程序云函数转发（可选）：非空则所有 /api/** 须带请求头 X-Proxy-Secret，与云函数环境变量 PROXY_SHARED_SECRET 一致。留空不校验。
# 云函数侧变量说明：aroapp/cloudfunctions/springProxy/ENV_CONSOLE.txt
app.mp.proxy.secret=

# 转移记录 PDF 导出：含中文，需可嵌入的 CJK 字体。.ttc（如 msyh.ttc）已自动解析；无系统字体时在此指定绝对路径，例如：
# 报表/PDF 中文字体（推荐微软雅黑 .ttf/.ttc，留空则自动探测系统字体）
# app.pdf.font-path=C:/Windows/Fonts/msyh.ttc
app.pdf.font-path=

# 对外可访问基址（用于生成绝对下载链接），例如 http://192.168.1.10:8080
# 双端图片互通 — 公网访问基址（云函数用此拼接完整下载 URL）
app.public-base-url=http://47.101.61.184:8080

# 双端图片互通 — 云函数同步密钥（防止公网随意调用同步端点）
app.upload.sync-secret=${UPLOAD_SYNC_SECRET:twin-upload-sync-2026}
# 上传/人脸模型/特征缓存落盘根目录（相对路径 = java -jar 启动时的工作目录，勿指向 JAR 内部）
# 独立部署示例：与 demo.jar 同目录下建 uploads/models/face_feature.zip、ultranet.zip
# app.upload.base-dir=uploads

# 登录页轮播图上传落盘目录（须可写；勿指向 JAR 内部）。默认用户目录下，与 JAR 分离；公开访问路径为 /api/public/login-branding/files/{文件名}
app.login-branding.upload-dir=${user.home}/.twin-system/login-branding-uploads

# 人员头像反代（白名单主机，逗号分隔）；与前端 resolvePersonnelAvatarUrl 域名策略对齐
app.personnel-avatar-proxy.allowed-hosts=aro.shsmu.edu.cn,shsmu.edu.cn
# 路径含 /jtu_files/ 时强制用该主机 HTTPS 拉取（修正库内错误域名/IP，避免证书 CN 不匹配）
app.personnel-avatar-proxy.canonical-file-host=aro.shsmu.edu.cn
# 仅头像出站：证书与域名不一致且无法修正时临时 true（影响 JVM 全局 HTTPS 校验，慎用）
app.personnel-avatar-proxy.insecure-tls=false

# ARO JTU 根路径（新闻代理等）；小程序改走 GET /api/public/aro/news，由服务端带 Token 访问 JTU
app.aro.jtu-api-base-url=https://aro.shsmu.edu.cn/jtu/api
# ARO 官方出站 HTTP 超时（毫秒）；超时后日志 [ARO·耗时] 会标 ok=false，便于与 MySQL 慢查询区分
app.aro.http.connect-timeout-ms=10000
app.aro.http.read-timeout-ms=45000
# ARO 出站连接池（HttpClient5）：复用 TLS，降低 scan/analyze 并行 noLeave+examOffline 冷连接 ~1s
app.aro.http.pool.max-total=32
app.aro.http.pool.max-per-route=16
# scan/analyze 全链路分段耗时打印到控制台（排查慢接口时开启，稳定后可关）
app.scan.analyze-timing-console=true
# 非 ARO 步骤低于此毫秒不打印；ARO 官方接口始终打印
app.scan.analyze-timing-console-min-ms=300

# 超时排查结构化日志：twin.diagnostics（grep "ARO·耗时" / "扫码·阶段" / "定时·执行" / "大华·拉取" / "MySQL·耗时"）
# 正常成功路径在 TwinTimingDiagnostics 中为 DEBUG；WARN 仅保留慢请求与失败
logging.level.twin.diagnostics=WARN

# 门禁规则 -> 大华权限联动调试开关
app.access-rule-dahua-debug=true

# 统一时区：JVM、Jackson、MySQL 全部 Asia/Shanghai
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
app.business-timezone=Asia/Shanghai

# 大华刷卡联动：处理「到期签退/激活超时」的定时节拍（毫秒，默认 5000）
app.dahua-swing.due-process-ms=5000

# ---------- WinCC REST 只读（动物房温湿度等）----------
# 未启用时 GET /api/v1/telemetry/wincc/snapshot 仍可用，返回 winccEnabled=false 与说明文案，不访问 WinCC。
# 说明：浏览器在 WinCC 页控制台能 fetch，是因为「页面与 WinCC 同源」；本后端从 Spring 所在机访问 https://CLIENT-01:8080/...，
# 必须在「运行 Spring 的那台电脑」上能 ping/HTTPS 通主机名；UnknownHostException 表示本机无法解析该名——改用 WinCC 服务器 IP（https://x.x.x.x:8080）、或在 hosts/DNS 中为该机配置别名后再保留 CLIENT-01。
# WinCC 拉取/测量日志（[WinCC测量]、[WinCC遥测]）；HTTP 明细可改为 DEBUG。
logging.level.com.example.demo.modules.telemetry=INFO
# 生产环境用环境变量 WINCC_PASSWORD 覆盖；未设置时使用下列本地默认值（与 application-local 一致）。
# 无法访问 WinCC 时改 app.wincc.enabled=false，避免启动后一直超时。
app.wincc.enabled=true
app.wincc.base-url=https://CLIENT-01:8080
app.wincc.username=${WINCC_USERNAME:admin}
app.wincc.password=${WINCC_PASSWORD:111111}
# WinCC 常用自签 HTTPS；正式受信证书可改为 false
app.wincc.ssl-insecure=true
app.wincc.connect-timeout-ms=8000
# 单次 POST 读超时（毫秒）；分片后每片单独计时。WinCC 偶发慢时仍可能超时，可再加大（如 180000）。
app.wincc.read-timeout-ms=120000
# 每次 /Values 请求 body 中 variableNames 最大条数，过大易 Read timed out，可 80～200 微调
app.wincc.values-chunk-size=150
# 后台刷新内存快照间隔（毫秒）；全量几千点、多分片时 WinCC 一轮很慢，建议 60000～120000，并关闭不参与的分区开关
app.wincc.refresh-interval-ms=60000
# 定时管理 TELEMETRY_WINCC_UI 关闭时，用 refresh-interval-ms 拉 WinCC；开启时本值为调度 tick 粒度（默认 5s 内判断是否到达轮询秒数）
app.wincc.scheduler-tick-ms=5000
# WinCC 遥测定时节拍专用线程池（与 spring.task.scheduling 隔离）；大点数保持 1 即可串行防叠压
app.wincc.scheduler.pool-size=1
app.wincc.scheduler.thread-name-prefix=wincc-telemetry-
# 测点清单：大 CSV 勿放仓库。推荐 database + 后台「WinCC 变量导入」页上传；或 classpath:/file: 外置路径。
# classpath=读 watchlist-csv；database=合并读 MySQL 各文件名分区下已启用的变量。
# 为 true（默认）时，启动阶段执行 classpath:db/telemetry-watchlist-schema.sql（CREATE IF NOT EXISTS），解决表不存在；生产可改为 false 由 DBA 单独建表。
app.wincc.ensure-watchlist-schema=true

# 遥测归档：WinCC 刷新成功后异步写入 telemetry_value_archive；保留天数与定时清理
app.telemetry.archive.enabled=true
app.telemetry.archive.retention-days=30
# 清理改由定时任务 TELEMETRY_ARCHIVE_PURGE（管理端「温湿度数据归档」+「定时任务管理」）；legacy-cron-purge=true 才启用旧 @Scheduled
app.telemetry.archive.legacy-cron-purge=false
app.telemetry.archive.purge-cron=0 40 3 * * ?
# database=后台「WinCC 变量」导入 MySQL 的清单（已启用 + 分区参与拉数），与现场配置一致，推荐默认。
# classpath=仅读 watchlist-csv / variable-names，否则退回内置 10 点——不会读你导入到库里的行。
app.wincc.watchlist-source=database
# app.wincc.watchlist-source=classpath
# 仅 watchlist-source 非 database 时生效：为 true 才允许快照刷新走 CSV/内置点名（开发临时用）。用 database 时请保持 false。
app.wincc.allow-non-database-snapshot-pull=false
# watchlist-csv 留空则 classpath 模式不下发大文件（回退内置 10 点）；需要时可改为 file:D:/config/xxx.csv
app.wincc.watchlist-csv=
# 若配置 variable-names，则完全忽略 CSV（适合临时再压几个点）：
# app.wincc.variable-names[0]=A203S_4.房间温度
# app.wincc.variable-names[1]=A203S_4.房间湿度

# ---------- 动物房 Hub（Web 与微信小程序同源：GET /api/v1/telemetry/wincc/animal-room-hub）----------
# 依赖：① 上文 app.wincc.*（内存快照）；② JobSchedulerService 中 TELEMETRY_WINCC_UI 计划行（程序坞轮询开关与间隔）；
# ③ TwinDashboardAggregationService（响应字段 runningStatusRooms 与 GET .../twin/dashboard/wechat-overview 同源）。
# 实现与字段说明见：src/main/java/com/example/demo/modules/telemetry/animalroom/README.md

# ---------- 注册推荐码 / 站内信附件 ----------
# 推荐码哈希用 pepper（生产务必改为随机长串并保密）
app.invite-code-pepper=${INVITE_CODE_PEPPER:change-me-in-production}
# 站内信附件本地目录（后续可换 OSS 实现）
app.chat.upload-dir=./data/chat-uploads

# 后台「文件模板下载」本地存储根目录（与 LocalChatObjectStorage 相同防穿越规则）
app.admin.template-upload-dir=./data/admin-template-uploads
# 单文件上限（字节），须小于 spring.servlet.multipart.max-file-size
app.admin.template-max-bytes=26214400

# ---------- 笼架占用统计：清算时分批拉 ARO（避免订阅/回填时瞬时打满）----------
# 每批笼架数；批次间隔毫秒（仅 AnalyticsAuditService 清算路径生效，页面实时查询仍逐架但不休眠）
# 笼架占用：全量拉取（无笼架条数上限）；分批请求 ARO 以降低瞬时压力
analytics.cage-occupancy.audit-batch-size=5
analytics.cage-occupancy.audit-batch-delay-ms=400

# ---------- 隔离服使用统计：门禁清洗数据源（cleaned | aro，默认 cleaned）----------
app.analytics.isolation.data-source=access_package

# ---------- 大华门禁 API（凭证与开关优先从系统设置 > 环境变量 > 此处默认值）----------
app.dahua.base-url=https://172.22.161.200
app.dahua.client-id=client_id
app.dahua.client-secret=
app.dahua.username=
app.dahua.password=
app.dahua.ssl-insecure=true

# ---------- ARO 系统登录（凭证优先从系统设置 > 环境变量 > 此处默认值）----------
app.aro.account=
app.aro.password=

# ---------- 人脸识别（环境变量 > 此处默认值；开关与阈值运行时可通过 /admin/settings?module=face 写入 DB）----------
# 总开关：关闭后所有下级功能（验证/录入/调试）全部不可用
app.face.master-enabled=${FACE_MASTER_ENABLED:true}
# 刷卡弹窗人脸验证
app.face.scan-popup-enabled=${FACE_SCAN_POPUP_ENABLED:true}
# PIN码替代人脸验证
app.face.pin-alternative-enabled=${FACE_PIN_ALTERNATIVE_ENABLED:false}
# 人脸识别调试页
app.face.debug-page-enabled=${FACE_DEBUG_PAGE_ENABLED:true}
# 底库照片管理
app.face.baseline-mgmt-enabled=${FACE_BASELINE_MGMT_ENABLED:true}
# 高安全区录入严模式
app.face.enroll-strict-enabled=${FACE_ENROLL_STRICT_ENABLED:false}
# 录入严模式：客户端帧间互配附加门槛（开启 face.enroll_strict.enabled 后生效）
app.face.enroll-strict-pair-min-sim=${FACE_ENROLL_STRICT_PAIR_MIN_SIM:0.72}
app.face.enroll-strict-min-count-above-pair=${FACE_ENROLL_STRICT_MIN_COUNT_ABOVE_PAIR:2}
app.face.enroll-strict-max-pair-sim=${FACE_ENROLL_STRICT_MAX_PAIR_SIM:0.82}
app.face.enroll-strict-top2-avg-min=${FACE_ENROLL_STRICT_TOP2_AVG_MIN:0.75}
# 路线 B 服务端 1:1 比对阈值（余弦相似度 0~1；ENV 为 seed 默认，运行期可在 /admin/settings?module=face 热改）
app.face.verify-match-threshold=${FACE_VERIFY_MATCH_THRESHOLD:0.62}
app.face.verify-reject-threshold=${FACE_VERIFY_REJECT_THRESHOLD:0.48}
app.face.verify-match-threshold-pip=${FACE_VERIFY_MATCH_THRESHOLD_PIP:0.58}
# 验证活体：是否眨眼 / 是否转头 / 转头保持毫秒（0=到位即过）
app.face.verify-liveness-blink-enabled=${FACE_VERIFY_LIVENESS_BLINK_ENABLED:true}
app.face.verify-liveness-turn-enabled=${FACE_VERIFY_LIVENESS_TURN_ENABLED:true}
app.face.verify-liveness-turn-hold-ms=${FACE_VERIFY_LIVENESS_TURN_HOLD_MS:800}
# 活体期间静默 Prefetch 比对（与活体并行，活体通过后可即时放行）
app.face.verify-prefetch-enabled=${FACE_VERIFY_PREFETCH_ENABLED:true}
app.face.verify-prefetch-interval-ms=${FACE_VERIFY_PREFETCH_INTERVAL_MS:900}
app.face.verify-pre-liveness-reject-threshold=${FACE_VERIFY_PRE_LIVENESS_REJECT_THRESHOLD:0.55}
# 录入活体：眨眼 / 左右转头 / 转头保持毫秒 / 注视秒数
app.face.enroll-liveness-blink-enabled=${FACE_ENROLL_LIVENESS_BLINK_ENABLED:true}
app.face.enroll-liveness-turn-left-enabled=${FACE_ENROLL_LIVENESS_TURN_LEFT_ENABLED:true}
app.face.enroll-liveness-turn-right-enabled=${FACE_ENROLL_LIVENESS_TURN_RIGHT_ENABLED:true}
app.face.enroll-liveness-turn-hold-ms=${FACE_ENROLL_LIVENESS_TURN_HOLD_MS:800}
app.face.enroll-hold-still-seconds=${FACE_ENROLL_HOLD_STILL_SECONDS:2}
# 可选：将 face_feature.zip / ultranet.zip 置于 ${app.upload.base-dir}/models/ 离线加载（默认 uploads/models/）
# 人脸比对并发：有界线程池 + Predictor 借还池（DJL 非线程安全）
app.face.inference.pool-core=2
app.face.inference.pool-max=4
app.face.inference.queue-capacity=32
app.face.inference.predictor-pool-size=2
app.face.inference.predictor-borrow-timeout-ms=60000
app.face.inference.verify-timeout-ms=120000