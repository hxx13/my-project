<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AGV 原始轨迹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;font-family:system-ui;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:6px;padding:6px 10px;background:#161b22;border-bottom:1px solid #30363d}
#bar button{padding:5px 12px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:12px;transition:.15s}
#bar button.on{border-color:#58a6ff;color:#58a6ff;background:#1f2937}
#bar button:hover{border-color:#8b949e}
#bar span{font-size:11px;color:#8b949e;margin-left:8px}
canvas{display:block;cursor:grab}
canvas:active{cursor:grabbing}
#info{position:fixed;bottom:6px;left:10px;font-size:11px;color:#484f58;pointer-events:none}
</style>
</head>
<body>
<div id="bar">
<button data-agv="0" class="on">AGV-1</button>
<button data-agv="1" class="on">AGV-2</button>
<button data-agv="2" class="on">AGV-3</button>
<button data-agv="3" class="on">AGV-4</button>
<span>|</span>
<button id="zoomIn">+</button>
<button id="zoomOut">-</button>
<button id="reset">重置</button>
<span id="stat"></span>
</div>
<canvas id="c"></canvas>
<div id="info"></div>

<script>
const COLORS = ["#58a6ff","#3fb950","#d29922","#bc8cff"];
let trails=[], active=new Set([0,1,2,3]);
let view={x:0,y:0,zoom:1};

fetch('raw_trails.json').then(r=>r.json()).then(data=>{
  trails=Object.values(data);
  document.getElementById('stat').textContent=
    trails.map((t,i)=>`AGV-${i+1}:${t.length}点`).join(' | ');
  draw();
});

const C=document.getElementById('c'), ctx=C.getContext('2d');
function resize(){C.width=window.innerWidth*devicePixelRatio;C.height=window.innerHeight*devicePixelRatio;C.style.width=window.innerWidth+'px';C.style.height=window.innerHeight+'px';draw();}
window.onresize=resize; resize();

function bounds(){
  let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity;
  for(let i=0;i<trails.length;i++){
    if(!active.has(i))continue;
    for(const p of trails[i]){
      if(p.x<xMin)xMin=p.x; if(p.x>xMax)xMax=p.x;
      if(p.y<yMin)yMin=p.y; if(p.y>yMax)yMax=p.y;
    }
  }
  return isFinite(xMin)?{xMin,xMax,yMin,yMax}:null;
}

function draw(){
  const w=C.width, h=C.height, dpr=devicePixelRatio;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,w,h);

  const bb=bounds();
  if(!bb){ctx.fillStyle='#484f58';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('无数据',w/2,h/2);return;}

  const pad=40;
  const sc=Math.min((w-2*pad)/(bb.xMax-bb.xMin),(h-2*pad)/(bb.yMax-bb.yMin))*view.zoom;
  function tx(x){return (x-bb.xMin)*sc+pad+view.x}
  function ty(y){return h-(y-bb.yMin)*sc-pad+view.y}

  // 网格
  ctx.strokeStyle='#21262d'; ctx.lineWidth=0.5;
  const step=view.zoom>2?1:view.zoom>1?2:5;
  for(let gx=Math.floor(bb.xMin/step)*step;gx<=bb.xMax;gx+=step){
    const x=tx(gx); ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
  }
  for(let gy=Math.floor(bb.yMin/step)*step;gy<=bb.yMax;gy+=step){
    const y=ty(gy); ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
  }

  // 坐标轴标签
  ctx.fillStyle='#484f58'; ctx.font='9px system-ui';
  ctx.textAlign='center';
  for(let gx=Math.floor(bb.xMin/step)*step;gx<=bb.xMax;gx+=step) ctx.fillText(gx.toFixed(0),tx(gx),ty(bb.yMin)-8);
  ctx.textAlign='right';
  for(let gy=Math.floor(bb.yMin/step)*step;gy<=bb.yMax;gy+=step) ctx.fillText(gy.toFixed(0),tx(bb.xMin)-4,ty(gy)+3);

  // 连线
  for(let i=0;i<trails.length;i++){
    if(!active.has(i))continue;
    const pts=trails[i], color=COLORS[i];
    // 站点圆
    for(const p of pts){
      if(!p.st)continue;
      ctx.fillStyle=color+'44'; ctx.beginPath();
      ctx.arc(tx(p.x),ty(p.y),2.5,0,Math.PI*2); ctx.fill();
    }
    // 移动线 — 按时间戳自然连线
    ctx.strokeStyle=color+'99'; ctx.lineWidth=1.5; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); let first=true;
    for(const p of pts){
      if(p.st)continue; // 站点处断开
      const px=tx(p.x),py=ty(p.y);
      if(first){ctx.moveTo(px,py);first=false;}
      else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }

  document.getElementById('info').textContent=
    `X ${bb.xMin.toFixed(1)}~${bb.xMax.toFixed(1)} | Y ${bb.yMin.toFixed(1)}~${bb.yMax.toFixed(1)} | 缩放 ${view.zoom.toFixed(1)}x | 滚轮缩放 拖拽平移`;
}

// 交互
let dragging=false, dx=0, dy=0;
C.onwheel=e=>{e.preventDefault();const z=view.zoom*(e.deltaY<0?1.15:0.87);view.zoom=Math.max(0.2,Math.min(20,z));draw();};
C.onmousedown=e=>{dragging=true;dx=e.clientX-view.x;dy=e.clientY-view.y;};
C.onmousemove=e=>{if(!dragging)return;view.x=e.clientX-dx;view.y=e.clientY-dy;draw();};
C.onmouseup=()=>dragging=false;
C.onmouseleave=()=>dragging=false;

document.querySelectorAll('#bar button[data-agv]').forEach(b=>{
  b.onclick=()=>{
    const i=+b.dataset.agv;
    if(active.has(i))active.delete(i);else active.add(i);
    b.className=active.has(i)?'on':'';
    draw();
  };
});
document.getElementById('zoomIn').onclick=()=>{view.zoom*=1.3;draw();};
document.getElementById('zoomOut').onclick=()=>{view.zoom*=0.77;draw();};
document.getElementById('reset').onclick=()=>{view={x:0,y:0,zoom:1};draw();};
</script>
</body>
</html>
